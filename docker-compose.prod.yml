version: '3.8'

services:
  # Hemall API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      additional_contexts:
        platform3o: ../platform/3O
    image: hemall/backend:v1.0.0-ghost-ignition
    ports:
      - "8000:8000"
    environment:
      # Settings 只读 HEMALL_* 前缀 (app/config.py)。以下变量名必须带前缀,
      # 否则会被静默忽略并回退到源码内的开发默认值。
      - HEMALL_ENVIRONMENT=production
      - HEMALL_LOG_LEVEL=INFO
      - HEMALL_PG_DSN=postgresql://hemall:${POSTGRES_PASSWORD:?set a strong postgres password}@postgres:5432/hemall
      - HEMALL_REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # ↓ 必须在部署时用真实强随机值覆盖 (下面是占位; HEMALL_ENVIRONMENT=production
      #   时启动会校验非默认值, 见 Settings.validate_production_security)。
      - HEMALL_JWT_SECRET=${HEMALL_JWT_SECRET:?set a strong random jwt secret}
      - HEMALL_WEBHOOK_SECRET=${HEMALL_WEBHOOK_SECRET:?set the webhook HMAC secret}
      - HEMALL_HARDWARE_SECRET=${HEMALL_HARDWARE_SECRET:?set the edge-bridge bearer secret}
      # Fernet PII 加密密钥 (无前缀, 经 os.getenv 读取)。缺失时每次重启换新 key,
      # 已加密数据将无法解密——production 启动会因此被拒绝。
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set a stable Fernet key}
      - GUNICORN_WORKERS=4
      - GUNICORN_TIMEOUT=30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hemall-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=hemall
      - POSTGRES_USER=hemall
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set a strong postgres password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - hemall-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hemall"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - hemall-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Elasticsearch 搜索引擎
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped
    networks:
      - hemall-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Nginx 反向代理 (生产环境推荐)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - hemall-network

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - hemall-network

  # Grafana 可视化
  grafana:
    image: grafana/grafana-enterprise:10.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set a strong grafana password}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - hemall-network

  # Jaeger 分布式追踪
  jaeger:
    image: jaegertracing/all-in-one:1.52
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
    restart: unless-stopped
    networks:
      - hemall-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

networks:
  hemall-network:
    driver: bridge