# Hemall live 栈基础件补齐（功能审计修复 2026-10-21）
#
# 背景：搜索（Elasticsearch）与分析（ClickHouse）的代码早已就绪，但 live 栈
# 从未部署这两个服务，线上一直是降级状态。本文件把它们作为附加服务注入
# 同一 compose 项目（-p hemal），并给 api 注入连接地址。
#
# 用法（部署目录）：
#   docker compose -p hemal \
#     -f docker-compose.mall-old.yml -f docker-compose.deploy.yml \
#     -f docker-compose.infra.yml up -d elasticsearch clickhouse
#   （api 需带上本文件重建一次以注入 env：up -d api）
#
# 网络：必须挂 hemall-backend（mall-old 定义的服务网络），否则与 api 不通。
#
# 单节点运维注记（2026-10-21 实测）：
#   - 本机 /data 长期 ~98% 满，ES 默认 95% 洪泛水位会拒绝分片分配（集群 red）。
#     已在集群持久化设置里把水位改成绝对值：low 5gb / high 3gb /
#     flood_stage 2gb（存于 ES 数据卷，重装 ES 需重设）。
#   - 索引副本数：hemall_products / hemall_autocomplete 均已设 replicas=0
#     （单节点副本无处分配，只会长期 yellow）；映射里默认仍是 1，
#     删除索引重建后需再设一次。
# 端口策略：ES/CH 只在项目内网可达，不发布到宿主机（CH 的 8123/9000、
# ES 的 9200 均不对公网/局域网开放，需要时走容器内或 SSH 隧道）。

services:
  elasticsearch:
    networks:
      - hemall-backend
    # 自建镜像：官方 8.15.3 + IK 中文分词插件（索引映射用 ik_max_word，
    # 无插件建索引 400）。构建配方: build-es-ik/Dockerfile
    image: hemall/elasticsearch-ik:8.15.3
    container_name: hemal-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  clickhouse:
    networks:
      - hemall-backend
    image: clickhouse/clickhouse-server:24.8
    container_name: hemal-clickhouse
    environment:
      # 新版 CH 的 default 用户只许本机连接，api 必须用独立账号（密码在 .env）。
      # 注：只在数据卷首次初始化时生效；已初始化的卷需手工 CREATE USER（已做）。
      CLICKHOUSE_USER: ${HEMALL_CLICKHOUSE_USER:-hemall}
      CLICKHOUSE_PASSWORD: ${HEMALL_CLICKHOUSE_PASSWORD:?set in .env}
      CLICKHOUSE_DB: ${HEMALL_CLICKHOUSE_DB:-hemall}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    environment:
      # 搜索：app/config.py 的 elasticsearch_url（HEMALL_ 前缀映射）
      HEMALL_ELASTICSEARCH_URL: http://elasticsearch:9200
      # 分析：app/config.py 的 clickhouse_url；为空时 AnalyticsService 纯 PG。
      HEMALL_CLICKHOUSE_URL: http://${HEMALL_CLICKHOUSE_USER:-hemall}:${HEMALL_CLICKHOUSE_PASSWORD:?set in .env}@clickhouse:8123/${HEMALL_CLICKHOUSE_DB:-hemall}

volumes:
  elasticsearch_data:
  clickhouse_data:
