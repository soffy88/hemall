# Prometheus 配置 - Phase 0
# 采集 hemall-backend 的指标

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# P1 冲刺: 生死告警规则 (prometheus.rules.yml, 容器内挂到 /etc/prometheus)
rule_files:
  - /etc/prometheus/prometheus.rules.yml

scrape_configs:
  # Hemall 应用指标
  - job_name: 'hemall-backend'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
