# Hemall 生死告警规则 (P1 冲刺 — 系统可以没有人工客服，但不能失去心跳监控)
#
# 指标源:
#   - http_requests_total / http_request_duration_seconds: middleware/metrics.py
#   - webhook_signature_rejected_total: security/webhook.py
#   - engine_tick_last_seconds / engine_failure_total: ext/oservi_lifecycle.py
#   - db_deadlock_errors_total: ext/oservi_lifecycle.py (DeadlockDetectedError)
#
# 告警接收: Prometheus 内评估 (rule_files)。通知渠道可接 Alertmanager /
# Grafana Alerting (本仓库未配置 Alertmanager 收件人，告警先在 Prometheus UI
# /alert 页可见)。

groups:
  - name: hemall-critical
    rules:
      # 1) 核心 API 5xx 错误率飙升 (死线: 支付/下单路径 5xx 即失血)
      - alert: HemallApi5xxRateSpike
        expr: |
          sum by (job) (rate(http_requests_total{status=~"5..", job="hemall-backend"}[5m]))
            / clamp_min(sum by (job) (rate(http_requests_total{job="hemall-backend"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "核心 API 5xx 错误率超过 5% (持续 5 分钟)"
          description: "job={{ $labels.job }} 的 5xx 占比 > 5%。检查支付/下单/库存端点与 DB 状态。"

      # 2) Webhook 验签失败频次激增 (被攻击/密钥漂移的早期信号)
      - alert: HemallWebhookSignatureRejections
        expr: increase(webhook_signature_rejected_total{job="hemall-backend"}[10m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Webhook 验签拒绝 10 分钟内超过 5 次"
          description: "回调验签连续失败，可能为伪造攻击或 HEMALL_WEBHOOK_SECRET 与回调方不一致。"

      # 3) 做市引擎 Tick 停滞 (价格智能心跳: 5 分钟引擎 >15 分钟未打点 = 心脏停跳)
      - alert: HemallMarketMakerTickStalled
        expr: time() - engine_tick_last_seconds{engine="ext-market-maker", job="hemall-backend"} > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "做市引擎 Tick 停滞超过 15 分钟"
          description: "ext-market-maker 已 15 分钟未打点，动态定价/试探单闭环可能已死。"

      # 4) DB 不可用 (503 爆发) 或事务死锁
      - alert: HemallDbUnavailableOrDeadlock
        expr: |
          rate(http_requests_total{status="503", job="hemall-backend"}[5m]) > 0
          or increase(db_deadlock_errors_total{job="hemall-backend"}[15m]) > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "DB 不可用 (503 爆发) 或事务死锁"
          description: "PostgreSQL 故障/死锁检测。检查 db 容器与连接池 (db_pool_used)。"

      # 5) P95 延迟超标 (交互体验失血: >2.5s 持续 10 分钟)
      - alert: HemallHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="hemall-backend"}[5m])))
          > 2.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API P95 延迟超过 2.5 秒 (持续 10 分钟)"
          description: "商城/结算路径慢查询或阻塞，检查慢 SQL 与连接池水位。"

  - name: hemall-availability
    rules:
      # 6) 服务不可达：Prometheus 连续抓不到后端。
      - alert: HemallBackendDown
        expr: up{job="hemall-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Hemall 后端不可达"
          description: "Prometheus 连续 2 分钟抓取 hemall-backend 失败；检查 api 容器、进程与网络。"

      # 7) DB 连接池心跳缺失。指标来自 app/middleware/metrics.py；应用无法
      # 建池时该序列不存在，因此用 absent() 而不是数值比较。
      - alert: HemallDatabasePoolMissing
        expr: absent(db_pool_used{job="hemall-backend"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Hemall 数据库连接池心跳缺失"
          description: "连续 5 分钟没有 db_pool_used 指标，通常表示 PostgreSQL 不可达或连接池未初始化。"

      # 8) Redis 断开。应用启动探针写入 redis_connected=0/1。
      - alert: HemallRedisDisconnected
        expr: redis_connected{job="hemall-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Hemall Redis 连接断开"
          description: "Redis 不可用会破坏限流、锁和实时能力；检查 redis 容器与 AOF/内存。"

      # 9) 磁盘 >90%。依赖 node_exporter 的 node_filesystem_* 指标；生产
      # Prometheus 需抓取 node_exporter，且根分区/数据盘 mountpoint 按实机确认。
      - alert: HemallDiskUsageAbove90
        expr: |
          max by (instance, mountpoint) (
            100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
          ) > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Hemall 主机磁盘使用率超过 90%"
          description: "{{ $labels.instance }} 的 {{ $labels.mountpoint }} 已超过 90%，备份/数据库可能随时失败。"

      # 10) 备份失败/过期。cron 脚本写 hemal_backup.prom，node_exporter
      # textfile collector 需指向 /data/soffy/backups/hemall。
      - alert: HemallBackupFailedOrStale
        expr: |
          hemal_backup_last_run_failed == 1
          or time() - hemal_backup_last_success_timestamp_seconds > 129600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Hemall 备份失败或超过 36 小时未成功"
          description: "检查 /data/soffy/backups/hemall/backup.log 与 cron；不要在没有可恢复备份时上线变更。"
