# Hemall Production Docker Compose for mall.sxueji.com
# 架构：Cloudflare Tunnel (远程管理模式) → Caddy (:8092) → FastAPI
# TLS 由 Cloudflare 边缘终止，Caddy 仅做内部反向代理

services:
  # ── Hemall API 服务 ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      additional_contexts:
        platform3o: ../platform/3O
    image: registry.sxueji.com/hemall/backend:latest
    restart: unless-stopped
    environment:
      # Database (sslmode=disable: 容器内网连接无需 TLS，避免 asyncpg 读取 root 客户端证书失败)
      HEMALL_PG_DSN: postgresql://hemall:${HEMALL_PG_PASSWORD}@db:5432/hemall_prod?sslmode=disable
      HEMALL_PG_POOL_MIN: 5
      HEMALL_PG_POOL_MAX: 30
      # Redis
      HEMALL_REDIS_URL: redis://redis:6379/0
      # JWT & Security
      HEMALL_JWT_SECRET: ${HEMALL_JWT_SECRET}
      HEMALL_JWT_ALGORITHM: HS256
      HEMALL_JWT_EXPIRES_MINUTES: 1440
      HEMALL_ANON_SALT: ${HEMALL_ANON_SALT}
      # CORS - Allow only mall.sxueji.com
      HEMALL_CORS_ORIGINS: '["https://mall.sxueji.com","https://www.mall.sxueji.com"]'
      # Output directory
      HEMALL_OUTPUT_ROOT: /app/var/omodul_output
      # Provider defaults
      HEMALL_DEFAULT_PAYMENT_PROVIDER: manual
      HEMALL_DEFAULT_FULFILLMENT_PROVIDER: manual
      HEMALL_DEFAULT_SEARCH_PROVIDER: log
      HEMALL_DEFAULT_NOTIFICATION_PROVIDER: log
      HEMALL_DEFAULT_TAX_PROVIDER: flat_rate
      HEMALL_FLAT_TAX_RATE_PERCENT: 10.0
      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_EXPORTER: otlp
      LOG_LEVEL: INFO
    volumes:
      - hemall_output:/app/var/omodul_output
      - hemall_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hemall-backend

  # ── PostgreSQL 数据库 ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hemall_prod
      POSTGRES_USER: hemall
      POSTGRES_PASSWORD: ${HEMALL_PG_PASSWORD}
      # Performance tuning
      POSTGRES_MAX_CONNECTIONS: "200"
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hemall"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hemall-backend

  # ── Redis 缓存 ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - hemall-backend

  # ── Hemall Web 前端 (Next.js 商城) ──────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://mall.sxueji.com
    image: registry.sxueji.com/hemall/frontend:latest
    restart: unless-stopped
    networks:
      - hemall-backend

  # ── Caddy 反向代理 (经 Cloudflare Tunnel 接入) ─────────────────
  # 说明：服务器架构为 Cloudflare Tunnel 远程管理模式（aegis-cloudflared 占 80/443）。
  # 本 Caddy 监听内部 HTTP 端口，由 Cloudflare 边缘终止 TLS，tunnel 路由指向此服务。
  # 标准镜像即可，无需 cloudflare-dns 插件（TLS 证书由 Cloudflare 管理）。
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      # 仅绑定宿主回环地址，避免端口冲突与暴露
      - "127.0.0.1:8092:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - hemall-backend
      - helios-net  # 与 aegis-cloudflared 同网络，tunnel 可通过容器名访问

  # ── Prometheus 监控 ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - hemall-backend

  # ── Grafana 可视化 ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - hemall-backend

  # ── Jaeger 分布式追踪 ───────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.53
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - hemall-backend

# ── 数据卷 ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  hemall_output:
    driver: local
  hemall_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ── 网络 ────────────────────────────────────────────────────────────
networks:
  hemall-backend:
    driver: bridge
  hemall-frontend:
    driver: bridge
  helios-net:
    external: true  # 共享网络：aegis-cloudflared 所在网络
