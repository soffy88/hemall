# hemall — Production-grade E-Commerce Backend
# ================================================

## Values Reference

api:
  replicas: 3
  image:
    repository: hemall/backend
    tag: 0.3.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  healthCheck: /health/ready
  livenessCheck: /health/live
  livenessThreshold: 60
  # 与 Dockerfile.prod 里写死的 hemall uid/gid 是同一个契约。
  # 换基础镜像或改 Dockerfile 的 useradd 时必须同步改这里，否则 pod
  # 会因为 gunicorn 的 setuid EPERM 而 CrashLoopBackOff（audit P1-1）。
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  # 生产环境额外配置
  env:
    LOG_LEVEL: INFO
    DATABASE_POOL_SIZE: 20
    REDIS_CONNECTION_POOL_SIZE: 20
    GUNICORN_WORKERS: 4
    GUNICORN_TIMEOUT: 30

ingress:
  enabled: true
  className: nginx
  host: api.hemall.example.com
  tlsSecret: hemall-tls
  # 生产环境 TLS 配置
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

postgresql:
  enabled: false
  external:
    host: postgres.hemall.svc.cluster.local
    port: 5432
    database: hemall
    username: hemall
    passwordSecretKey: pg-password
  # 生产环境连接池配置
  connectionPool:
    maxSize: 20
    maxOverflow: 30

redis:
  enabled: false
  external:
    host: redis.hemall.svc.cluster.local
    port: 6379
    passwordSecretKey: redis-password
  # 生产环境连接池配置
  connectionPool:
    maxSize: 20

elasticsearch:
  enabled: false
  external:
    host: elasticsearch-master
    port: 9200
  # 生产环境配置
  indices:
    numberOfShards: 3
    numberOfReplicas: 1

# 自动伸缩配置
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# 监控配置
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRule:
    enabled: true

# 生产凭据必须来自外部 Secret 管理（External Secrets / Sealed Secrets / Vault）。
# Secret 至少应提供 HEMALL_PG_DSN、HEMALL_REDIS_URL、HEMALL_ENVIRONMENT=production、
# HEMALL_JWT_SECRET、HEMALL_WEBHOOK_SECRET、HEMALL_HARDWARE_SECRET、ENCRYPTION_KEY、
# HEMALL_PRIVILEGED_STAFF_IDS、HEMALL_CORS_ORIGINS、HEMALL_PAYMENT_GATEWAY_PROVIDER，
# 以及所选支付网关和 HTTPS Elasticsearch 的全部凭据。
secrets:
  existingSecret: ""

# 安全配置
security:
  networkPolicies:
    enabled: true
  podSecurityStandards:
    enabled: true