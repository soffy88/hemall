# hemall — Production-grade E-Commerce Backend
# ================================================

## Values Reference

api:
  replicas: 3
  image:
    repository: hemall/backend
    tag: 0.3.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  healthCheck: /health/ready
  livenessCheck: /health/live
  livenessThreshold: 60
  # 生产环境额外配置
  env:
    LOG_LEVEL: INFO
    DATABASE_POOL_SIZE: 20
    REDIS_CONNECTION_POOL_SIZE: 20
    GUNICORN_WORKERS: 4
    GUNICORN_TIMEOUT: 30

ingress:
  enabled: true
  className: nginx
  host: api.hemall.example.com
  tlsSecret: hemall-tls
  # 生产环境 TLS 配置
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

postgresql:
  enabled: false
  external:
    host: postgres.hemall.svc.cluster.local
    port: 5432
    database: hemall
    username: hemall
    passwordSecretKey: pg-password
  # 生产环境连接池配置
  connectionPool:
    maxSize: 20
    maxOverflow: 30

redis:
  enabled: false
  external:
    host: redis.hemall.svc.cluster.local
    port: 6379
    passwordSecretKey: redis-password
  # 生产环境连接池配置
  connectionPool:
    maxSize: 20

elasticsearch:
  enabled: false
  external:
    host: elasticsearch-master
    port: 9200
  # 生产环境配置
  indices:
    numberOfShards: 3
    numberOfReplicas: 1

# 自动伸缩配置
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# 监控配置
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRule:
    enabled: true

# 安全配置
security:
  networkPolicies:
    enabled: true
  podSecurityStandards:
    enabled: true