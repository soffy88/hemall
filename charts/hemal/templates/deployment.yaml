apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: hemall-api
    version: {{ .Chart.AppVersion }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hemall-api
  template:
    metadata:
      labels:
        app: hemall-api
        version: {{ .Chart.AppVersion }}
    spec:
      # 安全上下文
      #
      # runAsUser/runAsGroup/fsGroup 必须等于镜像里 hemall 的 uid/gid。
      # 该数字在 Dockerfile.prod 里用 `useradd -u 10001` / `groupadd -g 10001`
      # 写死（不写死的话 `useradd -r` 会挑空闲系统号，基础镜像一变就漂移）。
      # 两边对不上的后果不是"权限不足"而是直接崩：gunicorn master 读
      # gunicorn.conf.py 的 user="hemall" 后对 worker 调 setgid/setuid，
      # 非 root 下抛 EPERM → master 退出 → CrashLoopBackOff。
      #
      # 这里不覆盖容器 ENTRYPOINT：entrypoint.sh 会先按实际 uid 决定要不要
      # 修数据卷属主（compose 以 root 跑时需要，K8s 非 root 跑时跳过）。
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.api.securityContext.runAsUser | default 10001 }}
        runAsGroup: {{ .Values.api.securityContext.runAsGroup | default 10001 }}
        fsGroup: {{ .Values.api.securityContext.fsGroup | default 10001 }}
      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        # 生产环境资源配置
        resources:
          requests:
            cpu: {{ .Values.api.resources.requests.cpu }}
            memory: {{ .Values.api.resources.requests.memory }}
          limits:
            cpu: {{ .Values.api.resources.limits.cpu }}
            memory: {{ .Values.api.resources.limits.memory }}
        # 环境变量配置
        env:
        - name: LOG_LEVEL
          value: {{ .Values.api.env.LOG_LEVEL | default "INFO" | quote }}
        - name: DATABASE_POOL_SIZE
          value: {{ .Values.api.env.DATABASE_POOL_SIZE | default "20" | quote }}
        - name: REDIS_CONNECTION_POOL_SIZE
          value: {{ .Values.api.env.REDIS_CONNECTION_POOL_SIZE | default "20" | quote }}
        - name: GUNICORN_WORKERS
          value: {{ .Values.api.env.GUNICORN_WORKERS | default "4" | quote }}
        - name: GUNICORN_TIMEOUT
          value: {{ .Values.api.env.GUNICORN_TIMEOUT | default "30" | quote }}
        # 限流真实客户端 IP (audit P1-5)。Settings 只读 HEMALL_* 前缀, 且缺省为 0
        # (=只认 ASGI 对端)。Ingress 是唯一入口且已在最后一跳写入单值
        # X-Forwarded-For/X-Real-IP, 故可信跳数=1; 不设则全网共享一个限流桶。
        - name: HEMALL_RATELIMIT_TRUSTED_PROXY_HOPS
          value: {{ .Values.api.env.HEMALL_RATELIMIT_TRUSTED_PROXY_HOPS | default "1" | quote }}
        # 从 Secret 注入敏感配置
        envFrom:
        - secretRef:
            name: {{ required ".Values.secrets.existingSecret must name an externally managed production Secret" .Values.secrets.existingSecret }}
        # 健康检查：liveness 只看进程存活，readiness 看依赖就绪
        livenessProbe:
          httpGet:
            path: {{ .Values.api.livenessCheck | default "/health/live" }}
            port: 8000
          initialDelaySeconds: {{ .Values.api.livenessThreshold }}
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: {{ .Values.api.healthCheck }}
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # 安全上下文
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        # 不设 command：镜像 ENTRYPOINT (entrypoint.sh) 负责修数据卷属主后
        # exec CMD。历史上这里写死 command: ["gunicorn"] + args，把
        # ENTRYPOINT 整个覆盖掉了 —— compose 路径的属主修复在 K8s 上被跳过。
        # 需要调参时只改 args（ENTRYPOINT 会被保留）。
      # 优雅终止
      terminationGracePeriodSeconds: 30