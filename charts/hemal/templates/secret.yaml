{{- if not .Values.secrets.existingSecret }}
{{- fail "Set .Values.secrets.existingSecret to an externally managed Secret containing all production credentials; this chart does not generate production secrets." }}
{{- end }}
{{- if .Values.elasticsearch.enabled }}
{{- fail "Bundled Elasticsearch is not configured with verified HTTPS authentication in this chart. Use an externally managed HTTPS Elasticsearch and put its URL, credentials, and CA path in the external Secret." }}
{{- end }}
