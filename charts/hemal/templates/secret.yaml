apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  HEMALL_ENVIRONMENT: "production"
  # 完整含密 DSN 请通过外部 Secret 管理覆盖 HEMALL_PG_DSN；此处仅骨架（不含密码），
  # 避免把 passwordSecretKey（key 名）误当密码写入。
  HEMALL_PG_DSN: "postgresql://{{ .Values.postgresql.external.username }}@{{ required ".Values.postgresql.external.host is required" .Values.postgresql.external.host }}:{{ .Values.postgresql.external.port }}/{{ .Values.postgresql.external.database }}"
  HEMALL_REDIS_URL: "redis://{{ required ".Values.redis.external.host is required" .Values.redis.external.host }}:{{ .Values.redis.external.port }}/0"
{{- if .Values.elasticsearch.enabled }}
  ELASTICSEARCH_URL: http://{{ .Release.Name }}-master:9200
{{- end }}
{{- if .Values.push.firebaseCredentialsSecretKey }}
  FIREBASE_CREDENTIALS_JSON: {{ .Values.push.firebaseCredentialsSecretKey }}
{{- end }}
