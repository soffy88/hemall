# Hemall Production Values for mall.sxueji.com
# ===========================================

# API 配置
api:
  replicas: 3
  image:
    repository: registry.sxueji.com/hemall/backend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  healthCheck: /health/ready
  livenessThreshold: 60
  env:
    HEMALL_LOG_LEVEL: INFO
    HEMALL_PG_POOL_MAX: 30
    HEMALL_PG_POOL_MIN: 7
    HEMALL_GUNICORN_WORKERS: 4
    HEMALL_GUNICORN_TIMEOUT: 30
    # HEMALL_CORS_ORIGINS 不在这里设：允许的来源属于生产凭据的一部分，
    # 由 secrets.existingSecret 提供（见 values.yaml 顶部的必需键清单）。
    # 之前这里写的是无前缀的 `CORS_ORIGINS`，模板从不引用它 —— 又一个
    # 改了不会生效的静默死键。

# Ingress 配置
ingress:
  enabled: true
  className: nginx
  host: mall.sxueji.com
  tlsSecret: hemall-tls-mall-sxueji
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Server: hemall";
      more_set_headers "X-Powered-By: FastAPI";

# 数据库配置
postgresql:
  enabled: false
  external:
    host: postgresql-primary.database.svc.cluster.local
    port: 5432
    database: hemall_production
    username: hemall
    passwordSecretKey: postgres-password
  connectionPool:
    maxSize: 30
    maxOverflow: 50

# Redis 配置
redis:
  enabled: false
  external:
    host: redis-master.cache.svc.cluster.local
    port: 6379
    passwordSecretKey: redis-password
  connectionPool:
    maxSize: 30

# Elasticsearch 配置
elasticsearch:
  enabled: false
  external:
    host: elasticsearch-master.logging.svc.cluster.local
    port: 9200
  indices:
    numberOfShards: 5
    numberOfReplicas: 1

# 自动伸缩配置
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# 监控配置
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRule:
    enabled: true

# 安全配置
security:
  networkPolicies:
    enabled: true
  podSecurityStandards:
    enabled: true

# 外部服务配置
externalServices:
  # 支付网关
  wechatPay:
    enabled: true
    merchantId: "your-wechat-merchant-id"
    apiKeySecretKey: "wechat-pay-api-key"
  
  alipay:
    enabled: true
    appId: "your-alipay-app-id"
    privateKeySecretKey: "alipay-private-key"
  
  # 推送服务
  firebase:
    enabled: true
    credentialsSecretKey: "firebase-credentials"
  
  apns:
    enabled: true
    keyId: "your-apns-key-id"
    teamId: "your-apns-team-id"
    keySecretKey: "apns-key"