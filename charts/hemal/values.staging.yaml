# Hemall Staging Values
# ====================

# API 配置
api:
  replicas: 2
  image:
    repository: registry.example.com/hemall/backend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  healthCheck: /health/ready
  livenessThreshold: 60
  env:
    LOG_LEVEL: DEBUG
    DATABASE_POOL_SIZE: 10
    REDIS_CONNECTION_POOL_SIZE: 10
    GUNICORN_WORKERS: 2
    GUNICORN_TIMEOUT: 30

# Ingress 配置
ingress:
  enabled: true
  className: nginx
  host: staging-api.hemall.com
  tlsSecret: hemall-tls-staging
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

# 数据库配置
postgresql:
  enabled: false
  external:
    host: postgresql-staging.database.svc.cluster.local
    port: 5432
    database: hemall_staging
    username: hemall
    passwordSecretKey: postgres-password
  connectionPool:
    maxSize: 10
    maxOverflow: 20

# Redis 配置
redis:
  enabled: false
  external:
    host: redis-staging.cache.svc.cluster.local
    port: 6379
    passwordSecretKey: redis-password
  connectionPool:
    maxSize: 10

# Elasticsearch 配置
elasticsearch:
  enabled: false
  external:
    host: elasticsearch-staging.logging.svc.cluster.local
    port: 9200
  indices:
    numberOfShards: 1
    numberOfReplicas: 0

# 自动伸缩配置
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# 监控配置
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRule:
    enabled: true

# 安全配置
security:
  networkPolicies:
    enabled: true
  podSecurityStandards:
    enabled: true