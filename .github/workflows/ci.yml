# Hemall CI Pipeline
# Phase 0: 基础加固 - CI/CD 自动化

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  UV_FROZEN: "1"

jobs:
  # ── 密钥扫描 ───────────────────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史以扫描所有提交

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          args: "--verbose --redact"

  # ── 代码质量检查 ──────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint (full app + tests)
        run: uv run ruff check app tests

      - name: Ruff format check (full app + tests)
        run: uv run ruff format --check app tests

      - name: Type check (full app)
        run: uv run mypy app --ignore-missing-imports --no-strict-optional

      - name: Actionlint workflow validation
        # NOTE: 不用 ghcr.io 的 docker 镜像（2026-10-19 起 runner 拉取被拒: denied），
        # 改直下官方 release 二进制，效果等价。
        run: |
          curl -sSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint ${{ github.workspace }}/.github/workflows/ci.yml

  # ── 单元/集成测试 (含 PG + Redis 服务容器) ────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [gitleaks]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hemall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra observability

      - name: Run tests with coverage
        env:
          TEST_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_REDIS_URL: redis://localhost:6379/0
          # conftest.test_redis_url 缺省指向 127.0.0.1:56379（本地专用测试 redis）；
          # CI 只有一个 redis service，用 db1 与 HEMALL_REDIS_URL(db0) 隔离
          TEST_REDIS_URL: redis://localhost:6379/1
        run: |
          uv run pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=55 \
            -v

      - name: P0 service coverage gates (orders/inventory/payments ≥ 80%)
        env:
          TEST_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_REDIS_URL: redis://localhost:6379/0
          # conftest.test_redis_url 缺省指向 127.0.0.1:56379（本地专用测试 redis）；
          # CI 只有一个 redis service，用 db1 与 HEMALL_REDIS_URL(db0) 隔离
          TEST_REDIS_URL: redis://localhost:6379/1
        run: |
          uv run pytest tests/ \
            --cov=app.orders.service \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q
          uv run pytest tests/ \
            --cov=app.inventory.service \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q
          uv run pytest tests/ \
            --cov=app.payments.service \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage to Codecov
        # 覆盖率上传是锦上添花：无 CODECOV_TOKEN 时 codecov 拒绝 tokenless
        # 上传（连 create-commit 都过不了），continue-on-error 保证不拖红 CI。
        # 如需覆盖率追踪，请在仓库 Settings > Secrets 中添加 CODECOV_TOKEN。
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 构建生产镜像 (Dockerfile.prod) ───────────────────────────────────
  build-prod:
    runs-on: ubuntu-latest
    needs: [lint, test, gitleaks]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile.prod
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: false
          tags: hemall-backend-prod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 部署配置校验 (scripts/validate/all.sh) ───────────────────────────
  validate-deploy:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Make validate script executable
        run: chmod +x scripts/validate/all.sh

      - name: Run deployment validation
        run: ./scripts/validate/all.sh

  # ── 前端构建与类型检查 ───────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        # next.config.ts fail-closed（audit F-05）：构建期必须给后端地址；
        # CI 只做构建校验，用占位地址即可（浏览器侧走同源 /api）。
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
        run: npm run build

  # ── 集成测试 (默认分支 push 才跑) ─────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hemall_integration
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra observability

      - name: Run integration tests
        env:
          TEST_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_integration
          HEMALL_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_integration
          HEMALL_REDIS_URL: redis://localhost:6379/0
          # conftest.test_redis_url 缺省指向 127.0.0.1:56379（本地专用测试 redis）；
          # CI 只有一个 redis service，用 db1 与 HEMALL_REDIS_URL(db0) 隔离
          TEST_REDIS_URL: redis://localhost:6379/1
        run: |
          uv run pytest tests/ -v
