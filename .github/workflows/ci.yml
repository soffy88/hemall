# Hemall CI Pipeline
# Phase 0: 基础加固 - CI/CD 自动化

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  UV_FROZEN: "1"

jobs:
  # ── 代码质量检查 ──────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint (full app + tests)
        run: uv run ruff check app tests

      - name: Ruff format check (full app + tests)
        run: uv run ruff format --check app tests

      - name: Type check (full app)
        run: uv run mypy app --ignore-missing-imports --no-strict-optional

      - name: Actionlint workflow validation
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" ghcr.io/rhysd/actionlint:1.7 -color /ws/.github/workflows/ci.yml

  # ── 单元/集成测试 (含 PG + Redis 服务容器) ────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hemall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra observability

      - name: Run tests with coverage
        env:
          TEST_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=55 \
            -v

      - name: P0 service coverage gates (orders/inventory/payments ≥ 80%)
        env:
          TEST_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest tests/ \
            --cov=app.orders.service \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q
          uv run pytest tests/ \
            --cov=app.inventory.service \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q
          uv run pytest tests/ \
            --cov=app.payments.service \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 构建生产镜像 (Dockerfile.prod) ───────────────────────────────────
  build-prod:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile.prod
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: false
          tags: hemall-backend-prod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 部署配置校验 (scripts/validate/all.sh) ───────────────────────────
  validate-deploy:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Make validate script executable
        run: chmod +x scripts/validate/all.sh

      - name: Run deployment validation
        run: ./scripts/validate/all.sh

  # ── 前端构建与类型检查 ───────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build

  # ── 集成测试 (默认分支 push 才跑) ─────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hemall_integration
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra observability

      - name: Run integration tests
        env:
          TEST_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_integration
          HEMALL_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_integration
          HEMALL_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest tests/ -v