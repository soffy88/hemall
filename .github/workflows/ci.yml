# Hemall CI Pipeline
# Phase 0: 基础加固 - CI/CD 自动化

name: CI

on:
  push:
    # Run on the repository's actual default branch as well as every feature
    # branch, so required checks cannot silently disappear after a branch rename.
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  UV_FROZEN: "1"

jobs:
  # ── 代码质量检查 ──────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # uv 按 uv.lock 可复现安装 (ruff/mypy 版本由 lock 钉死，不再 pip 浮动安装)。
      # 所有 3O 依赖都来自 pyproject/uv.lock 中的公开 Git 提交；Runner
      # 不需要任何 sibling 工作树。
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint (P0 service surface)
        # The legacy app/ and tests/ tree has pre-existing lint debt.  The
        # payment/outbox and engine compatibility surface is a hard gate for
        # this security work; tests still exercise the complete application.
        run: uv run ruff check app/p0_schema.py app/payments/service.py app/ext/oservi_compat.py app/events.py

      - name: Ruff format check (P0 service surface)
        run: uv run ruff format --check app/p0_schema.py app/payments/service.py app/ext/oservi_compat.py app/events.py

      - name: Type check (P0 service surface)
        run: uv run mypy app/p0_schema.py app/payments/service.py app/ext/oservi_compat.py app/events.py --ignore-missing-imports --no-strict-optional

  # ── 单元测试 ──────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hemall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra observability

      - name: Run tests with coverage
        env:
          TEST_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v

      - name: P0 service coverage gates
        env:
          TEST_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_test
          HEMALL_REDIS_URL: redis://localhost:6379/0
        run: |
          COVERAGE_FILE=/tmp/hemall-payment-service.coverage \
            uv run pytest tests/test_p0_transaction_services.py \
              --cov=app.payments.service \
              --cov-report=term-missing \
              --cov-fail-under=80 \
              -q
          COVERAGE_FILE=/tmp/hemall-inventory-service.coverage \
            uv run pytest tests/test_p0_transaction_services.py \
              --cov=app.inventory.service \
              --cov-report=term-missing \
              --cov-fail-under=80 \
              -q
          COVERAGE_FILE=/tmp/hemall-order-service.coverage \
            uv run pytest tests/test_p0_transaction_services.py \
              --cov=app.orders.service \
              --cov-report=term-missing \
              --cov-fail-under=80 \
              -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── 构建 Docker 镜像 ───────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: hemall-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 集成测试 (默认分支 push 才跑；TEST_PG_DSN 接通后 DB 门控用例真实执行) ──
  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hemall_integration
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra observability

      - name: Run integration tests
        env:
          TEST_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_integration
          HEMALL_PG_DSN: postgresql://postgres:test@localhost:5432/hemall_integration
          HEMALL_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest tests/ -v
