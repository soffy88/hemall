<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hemall 商城</title>
<style>
:root {
  --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0;
  --text: #0f172a; --muted: #64748b;
  --accent: #2563eb; --accent-hover: #1d4ed8;
  --danger: #dc2626; --ok: #16a34a;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }

/* ── Header ── */
header {
  position: sticky; top: 0; z-index: 40;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1120px; margin: 0 auto; padding: 0.85rem 1.25rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.brand { font-size: 1.35rem; font-weight: 800; letter-spacing: 0.02em; }
.brand em { font-style: normal; color: var(--accent); }
.cart-btn {
  display: flex; align-items: center; gap: 0.5rem;
  background: var(--accent); color: #fff; border: none;
  padding: 0.55rem 1.1rem; border-radius: 999px;
  font-size: 0.9rem; font-weight: 600; cursor: pointer;
  transition: background 0.2s ease;
}
.cart-btn:hover { background: var(--accent-hover); }
.cart-count {
  background: #fff; color: var(--accent);
  border-radius: 999px; min-width: 1.4rem; height: 1.4rem;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 700;
}

/* ── Layout ── */
main { max-width: 1120px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
.section-title { font-size: 1.1rem; font-weight: 700; margin: 0.5rem 0 1rem; }
.grid {
  display: grid; gap: 1.1rem;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}

/* ── Product card ── */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.1rem;
  display: flex; flex-direction: column; gap: 0.6rem;
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}
.card:hover { box-shadow: 0 8px 24px rgba(15,23,42,0.08); transform: translateY(-2px); }
.card-title { font-size: 1rem; font-weight: 700; line-height: 1.35; }
.card-desc {
  font-size: 0.8rem; color: var(--muted); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta { display: flex; align-items: center; justify-content: space-between; }
.price { font-size: 1.15rem; font-weight: 800; color: var(--danger); }
.price small { font-size: 0.75rem; font-weight: 600; }
.stock { font-size: 0.75rem; color: var(--muted); }
.stock.ok { color: var(--ok); }
.stock.low { color: #d97706; }
.opt-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.opt-tags span {
  font-size: 0.7rem; padding: 0.15rem 0.5rem;
  background: var(--bg); border: 1px solid var(--border); border-radius: 999px;
  color: var(--muted);
}
.add-btn {
  margin-top: auto; background: var(--accent); color: #fff; border: none;
  padding: 0.55rem; border-radius: 8px; font-size: 0.88rem; font-weight: 600;
  cursor: pointer; transition: background 0.2s ease;
}
.add-btn:hover { background: var(--accent-hover); }
.add-btn:disabled { background: #94a3b8; cursor: not-allowed; }

.empty {
  text-align: center; padding: 4rem 1rem; color: var(--muted);
}
.empty h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text); }

/* ── Cart drawer ── */
.overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(420px, 92vw);
  background: #fff; z-index: 60; transform: translateX(100%);
  transition: transform 0.28s ease;
  display: flex; flex-direction: column;
  box-shadow: -12px 0 40px rgba(15,23,42,0.15);
}
.drawer.show { transform: translateX(0); }
.drawer-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--border);
}
.drawer-head h2 { font-size: 1.05rem; }
.close-btn {
  background: none; border: none; font-size: 1.3rem; cursor: pointer;
  color: var(--muted); line-height: 1;
}
.drawer-body { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; }
.line-item {
  display: flex; gap: 0.8rem; padding: 0.9rem 0;
  border-bottom: 1px solid var(--border);
}
.line-item:last-child { border-bottom: none; }
.li-main { flex: 1; min-width: 0; }
.li-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.15rem; }
.li-sku { font-size: 0.72rem; color: var(--muted); }
.li-price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 0.45rem; }
.li-price { font-size: 0.9rem; font-weight: 700; color: var(--danger); }
.qty {
  display: inline-flex; align-items: center; gap: 0.4rem;
  border: 1px solid var(--border); border-radius: 8px; padding: 0.15rem;
}
.qty button {
  width: 1.7rem; height: 1.7rem; border: none; background: transparent;
  border-radius: 6px; cursor: pointer; font-size: 1rem; color: var(--text);
}
.qty button:hover { background: var(--bg); }
.qty span { min-width: 1.6rem; text-align: center; font-size: 0.88rem; font-weight: 600; }
.li-remove {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 0.78rem; text-decoration: underline; padding: 0;
}
.li-remove:hover { color: var(--danger); }

.drawer-foot {
  border-top: 1px solid var(--border); padding: 1rem 1.25rem;
  background: #fafafa;
}
.summary-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.4rem; }
.summary-row.total { font-size: 1.05rem; font-weight: 800; margin: 0.6rem 0 0.9rem; }
.summary-row.total .val { color: var(--danger); }
.primary-btn {
  width: 100%; background: var(--accent); color: #fff; border: none;
  padding: 0.75rem; border-radius: 10px; font-size: 0.95rem; font-weight: 700;
  cursor: pointer; transition: background 0.2s ease;
}
.primary-btn:hover { background: var(--accent-hover); }
.primary-btn:disabled { background: #94a3b8; cursor: not-allowed; }

/* ── Modal ── */
.modal {
  position: fixed; inset: 0; z-index: 70; display: none;
  align-items: center; justify-content: center; padding: 1rem;
}
.modal.show { display: flex; }
.modal-card {
  background: #fff; border-radius: 16px; width: min(460px, 100%);
  max-height: 90vh; overflow-y: auto; padding: 1.6rem;
  box-shadow: 0 24px 64px rgba(15,23,42,0.25);
}
.modal-card h2 { font-size: 1.15rem; margin-bottom: 1.1rem; }
.field { margin-bottom: 0.85rem; }
.field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.3rem; color: var(--muted); }
.field input, .field select {
  width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border);
  border-radius: 8px; font-size: 0.9rem; font-family: inherit; background: #fff;
}
.field input:focus, .field select:focus {
  outline: 2px solid rgba(37,99,235,0.3); border-color: var(--accent);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }

/* ── Success ── */
.success-icon {
  width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 1rem;
  background: rgba(22,163,74,0.12); color: var(--ok);
  display: flex; align-items: center; justify-content: center; font-size: 1.6rem;
}
.success-detail { text-align: center; margin-bottom: 1.2rem; color: var(--muted); font-size: 0.88rem; }
.success-detail strong { color: var(--text); font-size: 1.3rem; display: block; margin: 0.3rem 0; }

/* ── Toast ── */
.toast-wrap { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
.toast {
  background: #0f172a; color: #fff; padding: 0.6rem 1.1rem; border-radius: 10px;
  font-size: 0.85rem; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  animation: toast-in 0.25s ease;
}
.toast.err { background: var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

/* ── Footer / regions strip ── */
.regions-strip {
  max-width: 1120px; margin: 0 auto; padding: 0 1.25rem 2.5rem;
  color: var(--muted); font-size: 0.8rem;
}
.regions-strip b { color: var(--text); }
footer {
  border-top: 1px solid var(--border); background: #fff;
  text-align: center; padding: 1.2rem; color: var(--muted); font-size: 0.78rem;
}
.loading { text-align: center; padding: 4rem 1rem; color: var(--muted); }
.spinner {
  width: 32px; height: 32px; margin: 0 auto 0.8rem;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">Hemall <em>商城</em></div>
    <button class="cart-btn" id="cartBtn" onclick="openCart()">
      🛒 购物车 <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<main>
  <div class="section-title">全部商品</div>
  <div id="productArea">
    <div class="loading"><div class="spinner"></div>正在加载商品…</div>
  </div>
</main>

<div class="regions-strip" id="regionsStrip"></div>
<footer>Hemall Headless Commerce · <a href="/docs">API 文档</a></footer>

<!-- 购物车抽屉 -->
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>🛒 购物车</h2>
    <button class="close-btn" onclick="closeCart()">&times;</button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</aside>

<!-- 结算弹窗 -->
<div class="modal" id="checkoutModal">
  <div class="overlay show" style="position:absolute" onclick="closeCheckout()"></div>
  <div class="modal-card" id="checkoutCard"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
"use strict";

const CART_KEY = "hemall_cart_id";
let cartId = localStorage.getItem(CART_KEY);
let cart = null;

/* ── 工具 ── */
function fmt(cents) { return "¥" + (cents / 100).toFixed(2); }

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (!res.ok) {
    let msg = "HTTP " + res.status;
    try {
      const j = await res.json();
      if (j.detail !== undefined) msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail);
    } catch (_) { /* ignore */ }
    throw new Error(msg);
  }
  return res.json();
}

function toast(msg, isErr = false) {
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.remove(); }, 3200);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function optText(optionValues) {
  const o = optionValues || {};
  return Object.values(o).filter(Boolean).map(escapeHtml);
}

/* ── 商品列表 ── */
async function loadProducts() {
  const area = document.getElementById("productArea");
  try {
    const products = await api("/store/products");
    if (!products.length) {
      area.innerHTML =
        '<div class="empty"><h3>暂无在售商品</h3>' +
        '<p>商品目录为空。请通过管理端录入商品并发布（status=published）且保有库存。</p></div>';
      return;
    }
    area.innerHTML = '<div class="grid">' + products.map(card).join("") + "</div>";
  } catch (e) {
    area.innerHTML = '<div class="empty"><h3>加载失败</h3><p>' + escapeHtml(e.message) + "</p></div>";
  }
}

function card(p) {
  const price = p.min_price_cents != null ? fmt(p.min_price_cents) : "—";
  const stock = p.total_stock || 0;
  const stockCls = stock > 20 ? "ok" : "low";
  const stockTxt = stock > 0 ? (stock > 20 ? "现货 " + stock + " 件" : "仅剩 " + stock + " 件") : "缺货";
  const firstBatch = (p.variants || []).find(v => (v.batches || []).length)?.batches?.[0];
  const disabled = !firstBatch ? "disabled" : "";
  const tags = new Set();
  (p.variants || []).forEach(v => optText(v.option_values).forEach(t => tags.add(t)));
  const tagHtml = tags.size ? '<div class="opt-tags">' + [...tags].map(t => "<span>" + t + "</span>").join("") + "</div>" : "";
  return (
    '<div class="card">' +
      '<div class="card-title">' + escapeHtml(p.title) + "</div>" +
      '<div class="card-desc">' + escapeHtml(p.description || "") + "</div>" +
      tagHtml +
      '<div class="card-meta"><span class="price"><small>起</small> ' + price + "</span>" +
      '<span class="stock ' + stockCls + '">' + stockTxt + "</span></div>" +
      '<button class="add-btn" ' + disabled +
        ' onclick="addToCart(\'' + (firstBatch ? firstBatch.id : "") + '\', \'' + escapeHtml(p.title).replace(/'/g, "\\'") + '\')">' +
        (firstBatch ? "加入购物车" : "暂时缺货") + "</button>" +
    "</div>"
  );
}

/* ── 购物车 ── */
async function ensureCart() {
  if (cartId) {
    try { cart = await api("/store/carts/" + cartId); return cart; }
    catch (_) { cartId = null; localStorage.removeItem(CART_KEY); }
  }
  const c = await api("/store/carts", { method: "POST", body: JSON.stringify({ currency: "CNY", region_code: "cn-east" }) });
  cartId = c.cart_id;
  localStorage.setItem(CART_KEY, cartId);
  cart = await api("/store/carts/" + cartId);
  return cart;
}

async function refreshCart() {
  if (!cartId) { cart = null; renderCart(); return; }
  try { cart = await api("/store/carts/" + cartId); }
  catch (_) { cart = null; }
  renderCart();
}

function renderCart() {
  const countEl = document.getElementById("cartCount");
  const body = document.getElementById("cartBody");
  const foot = document.getElementById("cartFoot");

  const items = cart?.line_items || [];
  countEl.textContent = items.reduce((s, it) => s + (it.quantity || 0), 0);

  if (!items.length) {
    body.innerHTML = '<div class="empty"><h3>购物车是空的</h3><p>去挑选喜欢的商品吧</p></div>';
    foot.innerHTML = "";
    return;
  }
  body.innerHTML = items.map(li => {
    const opts = optText(li.option_values).map(t => " · " + t).join("");
    return (
      '<div class="line-item">' +
        '<div class="li-main">' +
          '<div class="li-title">' + escapeHtml(li.product_title) + "</div>" +
          '<div class="li-sku">' + escapeHtml(li.variant_sku) + opts + "</div>" +
          '<div class="li-price-row">' +
            '<span class="li-price">' + fmt(li.line_total_cents) + "</span>" +
            '<div class="qty">' +
              '<button onclick="changeQty(\'' + li.id + '\',' + (li.quantity - 1) + ')">−</button>' +
              "<span>" + li.quantity + "</span>" +
              '<button onclick="changeQty(\'' + li.id + '\',' + (li.quantity + 1) + ')"' +
                (li.quantity >= (li.available_qty || 99) ? " disabled" : "") + ">+</button>" +
            "</div>" +
          "</div>" +
          '<button class="li-remove" onclick="removeItem(\'' + li.id + '\')">移除</button>' +
        "</div>" +
      "</div>"
    );
  }).join("");

  const sub = cart.subtotal_cents || 0;
  const disc = cart.discount_cents || 0;
  const tax = cart.tax_cents || 0;
  const ship = cart.shipping_cents || 0;
  const total = cart.grand_total_cents != null ? cart.grand_total_cents : (sub - disc + tax + ship);
  foot.innerHTML =
    (disc ? '<div class="summary-row"><span>优惠</span><span>-' + fmt(disc) + "</span></div>" : "") +
    '<div class="summary-row"><span>小计</span><span>' + fmt(sub) + "</span></div>" +
    '<div class="summary-row total"><span>合计</span><span class="val">' + fmt(total) + "</span></div>" +
    '<button class="primary-btn" onclick="openCheckout()">去结算</button>';
}

async function addToCart(batchId, title) {
  if (!batchId) return;
  try {
    await ensureCart();
    await api("/store/carts/line-items", {
      method: "POST",
      body: JSON.stringify({ cart_id: cartId, batch_id: batchId, quantity: 1 }),
    });
    await refreshCart();
    toast("已加入购物车：" + title);
  } catch (e) {
    toast("加入失败：" + e.message, true);
  }
}

async function changeQty(lineItemId, qty) {
  if (qty < 1) return removeItem(lineItemId);
  try {
    await api("/store/carts/line-items", {
      method: "PUT",
      body: JSON.stringify({ cart_id: cartId, line_item_id: lineItemId, quantity: qty }),
    });
    await refreshCart();
  } catch (e) { toast("更新失败：" + e.message, true); }
}

async function removeItem(lineItemId) {
  try {
    await api("/store/carts/line-items", {
      method: "DELETE",
      body: JSON.stringify({ cart_id: cartId, line_item_id: lineItemId }),
    });
    await refreshCart();
  } catch (e) { toast("移除失败：" + e.message, true); }
}

/* ── 抽屉 / 弹窗开关 ── */
function openCart() {
  document.getElementById("drawer").classList.add("show");
  document.getElementById("overlay").classList.add("show");
  refreshCart();
}
function closeCart() {
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("overlay").classList.remove("show");
}

/* ── 结算 ── */
let regions = [];

async function loadRegions() {
  try {
    regions = await api("/store/regions");
    const strip = document.getElementById("regionsStrip");
    strip.innerHTML = regions.length
      ? "<b>配送区域：</b>" + regions.map(r => escapeHtml(r.name) + "（" + escapeHtml(r.currency) + "）").join(" · ")
      : "";
  } catch (_) { /* 非关键 */ }
}

async function openCheckout() {
  const card = document.getElementById("checkoutCard");
  const items = cart?.line_items || [];
  if (!items.length) { toast("购物车为空", true); return; }
  const total = cart.grand_total_cents != null ? fmt(cart.grand_total_cents) : "—";
  card.innerHTML =
    "<h2>确认订单</h2>" +
    '<div class="summary-row total"><span>应付总额</span><span class="val">' + total + "</span></div>" +
    '<div class="field"><label>收货人</label><input id="coName" placeholder="姓名"></div>' +
    '<div class="field"><label>手机号</label><input id="coPhone" placeholder="11 位手机号"></div>' +
    '<div class="field"><label>所在区域</label><select id="coRegion">' +
      regions.map(r => '<option value="' + escapeHtml(r.code) + '">' + escapeHtml(r.name) + "</option>").join("") +
    "</select></div>" +
    '<div class="field"><label>详细地址</label><input id="coAddr" placeholder="街道、门牌号"></div>' +
    '<div class="form-row">' +
      '<div class="field"><label>城市</label><input id="coCity" placeholder="城市"></div>' +
      '<div class="field"><label>邮编</label><input id="coZip" placeholder="邮政编码"></div>' +
    "</div>" +
    '<button class="primary-btn" id="coSubmit" onclick="submitCheckout()">提交订单</button>';
  document.getElementById("checkoutModal").classList.add("show");
}

function closeCheckout() {
  document.getElementById("checkoutModal").classList.remove("show");
}

async function submitCheckout() {
  const btn = document.getElementById("coSubmit");
  const name = document.getElementById("coName").value.trim();
  const phone = document.getElementById("coPhone").value.trim();
  const addr = document.getElementById("coAddr").value.trim();
  const city = document.getElementById("coCity").value.trim();
  const zip = document.getElementById("coZip").value.trim();
  const region = document.getElementById("coRegion").value;

  if (!name || !phone || !addr || !city) { toast("请填写完整的收货信息", true); return; }
  if (!/^1\d{10}$/.test(phone)) { toast("手机号格式不正确", true); return; }

  btn.disabled = true; btn.textContent = "提交中…";
  try {
    const res = await api("/store/checkout", {
      method: "POST",
      body: JSON.stringify({
        cart_id: cartId,
        shipping_address: {
          recipient_name: name, phone: phone,
          address_line1: addr, address_line2: "",
          city: city, region_code: region, postal_code: zip,
        },
      }),
    });
    localStorage.removeItem(CART_KEY);
    cartId = null; cart = null;
    renderCart();
    document.getElementById("checkoutCard").innerHTML =
      '<div style="text-align:center">' +
        '<div class="success-icon">✓</div>' +
        '<h2>订单提交成功</h2>' +
        '<div class="success-detail">订单号<strong>' + escapeHtml(res.order_id) + "</strong>" +
        "应付金额 " + fmt(res.grand_total_cents) + "</div>" +
        '<button class="primary-btn" onclick="closeCheckout()">继续购物</button>' +
      "</div>";
    toast("下单成功 🎉");
  } catch (e) {
    btn.disabled = false; btn.textContent = "提交订单";
    toast("下单失败：" + e.message, true);
  }
}

/* ── 初始化 ── */
(async function init() {
  await loadProducts();
  await loadRegions();
  await refreshCart();
})();
</script>
