[project]
name = "hemall"
version = "0.1.0"
description = "hemall headless commerce backend — 3O paradigm project service layer (§8), assembling the platform/3O element libraries into a runnable FastAPI commerce engine."
requires-python = ">=3.12"
dependencies = [
    # 3O element libraries (installed editable from ../platform/3O via [tool.uv.sources])
    "obase",
    "oprim",
    "oskill",
    "omodul",
    "oservi",
    # Project service layer stack
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # app.ext.oskill 直接用 scipy.spatial.Voronoi (recompute_voronoi_grid)；
    # 之前只是通过 oskill 包transitively 可用，这里显式声明，不依赖隐式传递依赖。
    "scipy>=1.11",
    # app.ext.spider_targets: 真实目标页解析 (苏宁/京东到家 HTML + OpenFoodFacts JSON)
    "beautifulsoup4>=4.12",
    # httpx 真实传输栈的 HTTP/2 依赖: 老版 h2 2.x + hyperframe 3.x 在 Py3.12
    # 下崩溃 (collections.MutableSet 已移除)，钉住兼容组合。
    "h2>=4.0",
    "hyperframe>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

# Phase 0: 可观测性与运维依赖
observability = [
    "structlog>=24.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20",
    "prometheus-client>=0.19",
    "slowapi>=0.1.9",
    "cryptography>=42.0",
]

# Phase 2: 高级商业能力
phase2 = [
    "elasticsearch>=8.12",
    "redis>=5.0",
    "firebase-admin>=6.0",
    # apns2 已于 2025-02 移除: 2020 年后未维护, 其 hyper 0.7 钉死
    # hyperframe<4.0, 与 Py3.12 下 h2 4.x (hyperframe>=6) 根本冲突,
    # 无法共存; push/providers.py 对 apns2 缺失做了优雅降级 (APNs disabled)。
]

[tool.uv.sources]
obase = { path = "../platform/3O/obase", editable = true }
oprim = { path = "../platform/3O/oprim", editable = true }
oskill = { path = "../platform/3O/oskill", editable = true }
omodul = { path = "../platform/3O/omodul", editable = true }
oservi = { path = "../platform/3O/oservi", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
