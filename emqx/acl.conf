%% Hemall EMQX 授权规则 (file authorizer)
%%
%% 配套: docker-compose.iot.yml 里 EMQX_AUTHORIZATION__NO_MATCH=deny +
%% DENY_ACTION=disconnect + CACHE__ENABLE=false。
%%
%% 为什么需要它 (audit P1-8):
%%   1883 原本完全没有认证。iot-bridge 收到任意 MQTT 消息后会用
%%   HARDWARE_SECRET 签名 POST /ext/hardware/webhook —— 于是"能连到 broker"
%%   等于"能伪造订单/库存/闸口事件"，而上游验签必然通过。认证解决"谁能连"，
%%   这份 ACL 解决"连上之后能碰哪些主题"。
%%
%% 语法: {动作, 客户端标识, 操作, [主题过滤列表]}.  动作 allow|deny
%%       主题过滤支持 + (单层) 与 # (多层)。
%%
%% 主题来自 edge_bridge/bridge_main.py 的 MQTT_SUB_TOPICS 默认值，两边必须
%% 同步 —— 改了一边忘了另一边，硬件事件会被静默丢弃（tests 里做了交叉校验）。
%% 网桥还需要订阅 resp 回执主题才能把闸口回执发回硬件。

{allow, {user, "edge_bridge"}, publish, ["cn/v1/+/s/+/pick", "cn/v1/+/g/+/req"]}.
{allow, {user, "edge_bridge"}, subscribe, ["cn/v1/+/s/+/pick", "cn/v1/+/g/+/req", "cn/v1/+/g/+/resp"]}.

%% 其余一律显式拒绝。no_match=deny 只在"没有规则匹配"时兜底；一旦上面
%% 某条 allow 被误写成宽泛模式，兜底就永远不会触发，所以这里显式写 deny。
{deny, all}.
